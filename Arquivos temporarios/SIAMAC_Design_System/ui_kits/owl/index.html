<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Owl" name="OWL · Weighing software UI kit" subtitle="Login → Dashboard → Weighing → Ticket" viewport="1440x900" -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>OWL — SIAMAC Software de Pesagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <link rel="stylesheet" href="owl.css"/>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="Login.jsx"></script>
  <script type="text/babel" src="AppShell.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="Weighing.jsx"></script>
  <script type="text/babel" src="TicketDetail.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [route, setRoute] = React.useState("login");

      const go = (next) => setRoute(next);

      // Re-render Lucide icons whenever the route changes
      React.useEffect(() => {
        if (window.lucide) {
          requestAnimationFrame(() => window.lucide.createIcons());
        }
      });

      if (route === "login") {
        return <Login onSubmit={() => go("dashboard")}/>;
      }

      const screens = {
        dashboard: { title: "Início", crumbs: "Operação · Dashboard", body: <Dashboard go={go}/>, onNew: () => go("weighing") },
        weighing:  { title: "Nova pesagem", crumbs: "Operação · Nova pesagem", body: <Weighing go={go}/> },
        tickets:   { title: "Tickets", crumbs: "Operação · Tickets", body: <Dashboard go={go}/>, onNew: () => go("weighing") },
        ticket:    { title: "Ticket de pesagem", crumbs: "Operação · Tickets · #PSG-2026-04-1828", body: <TicketDetail go={go}/> },
      };
      const s = screens[route] || screens.dashboard;

      return (
        <AppShell route={route} go={go} title={s.title} crumbs={s.crumbs} onNew={s.onNew}>
          {s.body}
        </AppShell>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>

<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors · Graphite neutrals" subtitle="–ink-0…900 — cool UI grays" viewport="700x170" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);}
  body{padding:24px 28px;}
  .row{display:flex;align-items:stretch;gap:0;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-inset);}
  .step{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;}
  .step.dark{color:#fff;} .step.light{color:#0B0F14;}
  .s-name{font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.08em;}
  .s-hex{font-family:var(--font-mono);font-size:10px;opacity:.85;}
  .title{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--fg-1);margin-bottom:10px;}
  .sub{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);}
</style></head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:baseline;">
    <div class="title">Graphite — UI chrome neutrals</div>
    <div class="sub">--ink-*</div>
  </div>
  <div class="row">
    <div class="step light" style="background:#FFFFFF;border-right:1px solid #ECEFF3;"><div class="s-name">0</div><div class="s-hex">#FFFFFF</div></div>
    <div class="step light" style="background:#FAFBFC;"><div class="s-name">25</div><div class="s-hex">#FAFBFC</div></div>
    <div class="step light" style="background:#F4F6F9;"><div class="s-name">50</div><div class="s-hex">#F4F6F9</div></div>
    <div class="step light" style="background:#ECEFF3;"><div class="s-name">75</div><div class="s-hex">#ECEFF3</div></div>
    <div class="step light" style="background:#DDE3EA;"><div class="s-name">100</div><div class="s-hex">#DDE3EA</div></div>
    <div class="step light" style="background:#C2CBD6;"><div class="s-name">200</div><div class="s-hex">#C2CBD6</div></div>
    <div class="step dark" style="background:#9AA5B4;"><div class="s-name">300</div><div class="s-hex">#9AA5B4</div></div>
    <div class="step dark" style="background:#6E7A8A;"><div class="s-name">400</div><div class="s-hex">#6E7A8A</div></div>
    <div class="step dark" style="background:#4E5A6B;"><div class="s-name">500</div><div class="s-hex">#4E5A6B</div></div>
    <div class="step dark" style="background:#36404E;"><div class="s-name">600</div><div class="s-hex">#36404E</div></div>
    <div class="step dark" style="background:#232A35;"><div class="s-name">700</div><div class="s-hex">#232A35</div></div>
    <div class="step dark" style="background:#0B0F14;"><div class="s-name">900</div><div class="s-hex">#0B0F14</div></div>
  </div>
</body></html>

<!DOCTYPE html>
<!-- @dsCard group="Components" name="Iconography · Lucide" subtitle="Selected weighing-relevant icons" viewport="700x260" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);}
  body{padding:22px 28px;}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:18px 14px;align-items:center;}
  .cell{display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--fg-2);}
  .cell svg{stroke-width:1.75;}
  .nm{font-family:var(--font-mono);font-size:9px;color:var(--fg-3);}
  .title{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--fg-1);margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;}
  .sub{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);}
</style></head>
<body>
  <div class="title"><span>Iconography · Lucide line set</span><span class="sub">20×20 · stroke 1.75</span></div>
  <div class="grid">
    <div class="cell"><i data-lucide="truck"></i><div class="nm">truck</div></div>
    <div class="cell"><i data-lucide="scale"></i><div class="nm">scale</div></div>
    <div class="cell"><i data-lucide="gauge"></i><div class="nm">gauge</div></div>
    <div class="cell"><i data-lucide="ticket"></i><div class="nm">ticket</div></div>
    <div class="cell"><i data-lucide="shield-check"></i><div class="nm">shield</div></div>
    <div class="cell"><i data-lucide="bar-chart-3"></i><div class="nm">chart</div></div>
    <div class="cell"><i data-lucide="file-text"></i><div class="nm">file</div></div>
    <div class="cell"><i data-lucide="users"></i><div class="nm">users</div></div>
    <div class="cell"><i data-lucide="settings"></i><div class="nm">settings</div></div>
    <div class="cell"><i data-lucide="search"></i><div class="nm">search</div></div>
    <div class="cell"><i data-lucide="bell"></i><div class="nm">bell</div></div>
    <div class="cell"><i data-lucide="download"></i><div class="nm">download</div></div>
    <div class="cell"><i data-lucide="printer"></i><div class="nm">printer</div></div>
    <div class="cell"><i data-lucide="alert-triangle"></i><div class="nm">alert</div></div>
    <div class="cell"><i data-lucide="check-circle-2"></i><div class="nm">check</div></div>
    <div class="cell"><i data-lucide="x-circle"></i><div class="nm">x</div></div>
    <div class="cell"><i data-lucide="play-circle"></i><div class="nm">play</div></div>
    <div class="cell"><i data-lucide="pause-circle"></i><div class="nm">pause</div></div>
    <div class="cell"><i data-lucide="refresh-cw"></i><div class="nm">refresh</div></div>
    <div class="cell"><i data-lucide="more-horizontal"></i><div class="nm">more</div></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>

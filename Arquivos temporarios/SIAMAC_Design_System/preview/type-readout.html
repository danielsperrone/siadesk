<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type · Weight readout" subtitle="JetBrains Mono — tabular numerics" viewport="700x200" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--ink-900);color:#fff;}
  body{padding:28px 32px;display:flex;align-items:center;gap:36px;}
  .label{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#88A4CB;}
  .unit{font-family:var(--font-mono);font-size:18px;color:#88A4CB;margin-left:8px;font-weight:500;}
  .meta{font-family:var(--font-mono);font-size:10px;color:#88A4CB;}
</style></head>
<body>
  <div>
    <div class="label">Peso bruto</div>
    <div style="font-family:var(--font-mono);font-weight:700;font-size:84px;line-height:1;letter-spacing:-.01em;color:#fff;margin-top:8px;font-variant-numeric:tabular-nums;">
      32.480<span class="unit">kg</span>
    </div>
    <div class="meta" style="margin-top:8px;">JetBrains Mono · 84/700 · tabular-nums</div>
  </div>
  <div>
    <div class="label">Ticket</div>
    <div style="font-family:var(--font-mono);font-weight:500;font-size:22px;color:#fff;margin-top:8px;">#PSG-2026-04-1827</div>
    <div class="meta" style="margin-top:8px;">JetBrains Mono · 22/500</div>
  </div>
</body></html>

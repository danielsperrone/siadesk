<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors · Emerald scale" subtitle="–siamac-green-50…900 (success)" viewport="700x170" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);}
  body{padding:24px 28px;}
  .row{display:flex;align-items:stretch;gap:0;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-inset);}
  .step{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;}
  .step.dark{color:#fff;} .step.light{color:#0B0F14;}
  .s-name{font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.08em;}
  .s-hex{font-family:var(--font-mono);font-size:10px;opacity:.85;}
  .title{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--fg-1);margin-bottom:10px;}
  .sub{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);}
</style></head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:baseline;">
    <div class="title">Emerald — success / positive</div>
    <div class="sub">--siamac-green-*</div>
  </div>
  <div class="row">
    <div class="step light" style="background:#E8F4ED;"><div class="s-name">50</div><div class="s-hex">#E8F4ED</div></div>
    <div class="step light" style="background:#C9E6D5;"><div class="s-name">100</div><div class="s-hex">#C9E6D5</div></div>
    <div class="step light" style="background:#8FCDA9;"><div class="s-name">200</div><div class="s-hex">#8FCDA9</div></div>
    <div class="step dark" style="background:#20A360;"><div class="s-name">500</div><div class="s-hex">#20A360</div></div>
    <div class="step dark" style="background:#099653;"><div class="s-name">600</div><div class="s-hex">#099653</div></div>
    <div class="step dark" style="background:#018743;"><div class="s-name">700 · base</div><div class="s-hex">#018743</div></div>
    <div class="step dark" style="background:#016432;"><div class="s-name">800</div><div class="s-hex">#016432</div></div>
    <div class="step dark" style="background:#014523;"><div class="s-name">900</div><div class="s-hex">#014523</div></div>
  </div>
</body></html>

<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type · Eyebrows & captions" subtitle="All-caps micro-labels" viewport="700x190" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  body{padding:28px 32px;display:flex;gap:48px;align-items:flex-start;}
  .col{display:flex;flex-direction:column;gap:14px;}
  .label{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);letter-spacing:.04em;}
</style></head>
<body>
  <div class="col">
    <div class="label">Eyebrows · 11/700 · letter-spacing .14em</div>
    <div class="t-eyebrow">PESAGEM RODOVIÁRIA</div>
    <div class="t-eyebrow" style="color:var(--siamac-red-700);">AUDITORIA · OWL</div>
    <div class="t-eyebrow" style="color:var(--siamac-green-700);">DENTRO DA TOLERÂNCIA</div>
  </div>
  <div class="col">
    <div class="label">Caption · Inter 12/500</div>
    <div class="t-caption">Balança 02 · Indicador Toledo MGR-3000</div>
    <div class="t-caption">Operador: Marcos A. · turno A</div>
    <div class="t-caption">Atualizado há 12 segundos</div>
  </div>
</body></html>

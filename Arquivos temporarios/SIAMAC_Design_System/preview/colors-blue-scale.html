<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors · Navy scale" subtitle="–siamac-blue-50…900 (primary)" viewport="700x170" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);}
  body{padding:24px 28px;}
  .row{display:flex;align-items:stretch;gap:0;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-inset);}
  .step{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;color:#fff;}
  .step.dark{color:#fff;} .step.light{color:#0B0F14;}
  .s-name{font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.08em;}
  .s-hex{font-family:var(--font-mono);font-size:10px;opacity:.85;}
  .title{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--fg-1);margin-bottom:10px;}
  .sub{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);}
</style></head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:baseline;">
    <div class="title">Navy — primary scale</div>
    <div class="sub">--siamac-blue-*</div>
  </div>
  <div class="row">
    <div class="step light" style="background:#E8EFF7;"><div class="s-name">50</div><div class="s-hex">#E8EFF7</div></div>
    <div class="step light" style="background:#C8D7EA;"><div class="s-name">100</div><div class="s-hex">#C8D7EA</div></div>
    <div class="step light" style="background:#88A4CB;"><div class="s-name">200</div><div class="s-hex">#88A4CB</div></div>
    <div class="step dark" style="background:#1F62A6;"><div class="s-name">500</div><div class="s-hex">#1F62A6</div></div>
    <div class="step dark" style="background:#0D5497;"><div class="s-name">600</div><div class="s-hex">#0D5497</div></div>
    <div class="step dark" style="background:#004788;"><div class="s-name">700 · base</div><div class="s-hex">#004788</div></div>
    <div class="step dark" style="background:#003365;"><div class="s-name">800</div><div class="s-hex">#003365</div></div>
    <div class="step dark" style="background:#002347;"><div class="s-name">900</div><div class="s-hex">#002347</div></div>
  </div>
</body></html>
